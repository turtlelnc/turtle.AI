name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Build and test
      run: make test -j2
    - name: Check memory and undefined behavior
      run: make sanitize -j2

  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MinGW (GCC for Windows)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc

    - name: Compile train.cpp and BPE sources
      shell: msys2 {0}
      run: |
        g++ -O3 -std=c++17 \
          train.cpp BPE.cpp \
          -o train.exe \
          -I. \
          -fopenmp \
          -static-libgcc \
          -static-libstdc++ \
          -Wl,-Bstatic -lgomp -lwinpthread -Wl,-Bdynamic

    - name: Verify Output
      shell: msys2 {0}
      run: |
        ls -lh train.exe
        file train.exe

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: train-windows-exe
        path: train.exe
        retention-days: 5
